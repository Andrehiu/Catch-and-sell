<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#24324A" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Catch &amp; Sell" />
    <title>Catch &amp; Sell</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111827; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      #game {
        width: 100vw; height: 100dvh; box-sizing: border-box;
        /* keep the bottom tabs clear of the iPhone home bar / notch */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #update-bar {
        position: fixed; left: 8px; right: 8px; top: calc(env(safe-area-inset-top) + 8px); z-index: 10;
        min-height: 44px; padding: 8px 12px; border: 3px solid #FFF3D6; background: #24324A; color: #FFF3D6;
        font: 16px 'Pixelify Sans', monospace; box-shadow: 4px 4px 0 #111827; touch-action: manipulation;
      }
      canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
